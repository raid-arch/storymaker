name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
permissions:
  contents: write
jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || vars.ANDROID_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - name: Restore private signing key
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then echo "Configure the private Android signing secrets documented in docs/android.md."; exit 1; fi
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/tsuzuriniwa-release.p12"
          chmod 600 "$RUNNER_TEMP/tsuzuriniwa-release.p12"
      - run: npm run android:apk
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tsuzuriniwa-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: tsuzuriniwa
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/
      - name: Publish tagged APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --title "綴庭 Android ${GITHUB_REF_NAME#android-v}" --generate-notes
